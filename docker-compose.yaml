version: "3.8"
services:
  mysqldb:
    image: mysql:latest
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: moaishelper
    networks:
      - app_network
    restart: always
    volumes:
      - db:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
      # или - ./init.sql:/docker-entrypoint-initdb.d/init.sql (если без каталога)

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: app:latest
    networks:
      - app_network
    depends_on:
      - mysqldb
    restart: always
    container_name: app
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/moaishelper?useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: admin123

networks:
  app_network:
    driver: bridge

volumes:
  db: