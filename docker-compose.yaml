services:
  postgresdb:
    image: postgres:latest
    container_name: db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: moaishelper
    networks:
      - app_network
    restart: always
    volumes:
      - db:/var/lib/postgres/data

  app:
    build:
      context: docker-product-server
      dockerfile: Dockerfile
    image: app:latest
    networks:
      - app_network
    depends_on:
      - postgresdb
    restart: always
    container_name: app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123

networks:
  app_network:
    driver: bridge

volumes:
  db:
